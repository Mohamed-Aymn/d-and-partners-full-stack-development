<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>


  <style>
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;

      .container__card {
        display: flex;
        align-items: center;
        gap: 20px;
        background-color: #cfcfcf;
        border-radius: 10px;
        padding: 0.3em;

        .container__card__generation {
          background-color: red;
          width: 50px;
          height: 50px;
        }
      }
    }
  </style>
</head>

<body>

  <h1>here are the list of cards</h1>

  <div class="container">
    <!-- cards should be renered here -->
  </div>



  <script>
    const dataFetch = async () => {
      const request = await fetch("https://api.restful-api.dev/objects");
      const data = await request.json();

      return data;
    }

    // const render = (data) => {
    //   const container = document.querySelector(".container");

    //   data.map(item => {
    //     const card = document.createElement("div");
    //     card.classList.add("container__card");
    //     card.innerHTML = item.name;
    //     container.appendChild(card);
    //   });
    // }


    const renderEnhanced = (data) => {
      const container = document.querySelector(".container");

      data.map(item => {
        const card = document.createElement("div");
        card.classList.add("container__card");
        card.innerHTML = `
            <span>${item.id}</span>
            <h2>${item.name}</h2>
            ${item.data?.Generation ? `<span class="container__card__generation">${item.data.Generation}</span>` : ""}
        `

        container.appendChild(card);
      })
    }


    const fetchAndRender = async () => {
      const data = await dataFetch();
      renderEnhanced(data);
    }


    fetchAndRender()

  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta Express App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Meta Express App</h1>
      <p>One Express server for both APIs and HTML pages.</p>

      <section>
        <h2>HTML pages</h2>
        <ul>
          <li><a href="/users">/users</a></li>
          <li><a href="/todo-items">/todo-items</a></li>
        </ul>
      </section>

      <section>
        <h2>API routes</h2>
        <ul>
          <li><a href="/api/users">/api/users</a></li>
          <li><a href="/api/todo-items">/api/todo-items</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>

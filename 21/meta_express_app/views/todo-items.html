<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Items</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <nav><a href="/">Home</a> · <a href="/users">Users</a></nav>
      <h1>Todo Items</h1>
      <p>Data loaded from <code>/api/todo-items</code></p>
      <ul id="todos-list" class="list">Loading…</ul>
    </main>
    <script>
      async function loadTodos() {
        const list = document.getElementById("todos-list");
        try {
          const res = await fetch("/api/todo-items");
          const todos = await res.json();
          list.innerHTML = todos
            .map(
              (todo) =>
                `<li class="${todo.completed ? "done" : ""}">
                  <strong>${todo.title}</strong>
                  <br /><span>${todo.completed ? "Completed" : "Pending"} · user #${todo.userId}</span>
                </li>`
            )
            .join("");
        } catch (err) {
          list.textContent = "Failed to load todo items.";
          console.error(err);
        }
      }
      loadTodos();
    </script>
  </body>
</html>

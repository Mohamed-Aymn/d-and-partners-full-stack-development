<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old State Management</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #fffdf9;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --border: #e7e5e4;
      --shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, #dcfce7 0%, transparent 35%),
        radial-gradient(circle at top right, #ccfbf1 0%, transparent 30%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255, 253, 249, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 1.25rem;
    }

    .cart-badge {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      min-width: 1.35rem;
      height: 1.35rem;
      padding: 0 0.3rem;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1.5rem;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.5rem 2rem;
    }

    .main,
    .cart-aside {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
    }

    .main {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 320px;
    }

    .main h1 {
      font-size: 1.75rem;
    }

    .main p {
      color: var(--muted);
      text-align: center;
      max-width: 28ch;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .counter button {
      width: 3rem;
      height: 3rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--accent);
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .counter button:hover {
      opacity: 0.9;
    }

    .counter button:active {
      transform: scale(0.96);
    }

    #count {
      min-width: 3rem;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
    }

    .cart-aside {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-aside h2 {
      font-size: 1.1rem;
    }

    .cart-aside .items-added {
      padding: 1rem;
      border-radius: 0.75rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      text-align: center;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="brand">Shop Demo</div>
    <div class="cart-icon-wrap" aria-label="Cart">
      🛒
      <span class="cart-badge" id="nav-count">0</span>
    </div>
  </nav>

  <div class="layout">
    <main class="main">
      <h1>Counter</h1>
      <p>Each click updates one shared count — shown in three places on this page.</p>
      <div class="counter">
        <button id="decrease" type="button" aria-label="Decrease">−</button>
        <span id="count">0</span>
        <button id="increase" type="button" aria-label="Increase">+</button>
      </div>
    </main>

    <aside class="cart-aside">
      <h2>Cart</h2>
      <div class="items-added">
        <span id="aside-count">0</span> items added
      </div>
      <p class="hint">
        The aside, navbar badge, and counter all read from the same <code>count</code> state.
      </p>
    </aside>
  </div>

  <script>
    // 1. state
    let count = 0;

    // 2. state update functions
    const increase = () => count++;
    const decrease = () => count--;

    // 3. HTML elements grab
    let counterValue = document.getElementById("count");
    let navCount = document.getElementById("nav-count");
    let asideCount = document.getElementById("aside-count");
    let incBtn = document.getElementById("increase");
    let decBtn = document.getElementById("decrease");

    // 4. event listeners attachment and state update functions
    incBtn.addEventListener("click", () => {
      increase();
      counterValue.innerText = count;
      navCount.innerText = count;
      asideCount.innerText = count;
    });

    decBtn.addEventListener("click", () => {
      decrease();
      counterValue.innerText = count;
      navCount.innerText = count;
      asideCount.innerText = count;
    });
  </script>
</body>

</html>

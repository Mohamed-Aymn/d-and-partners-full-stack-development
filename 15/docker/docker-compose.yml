services:
  mysql-server:
    image: mysql:latest
    container_name: mysql-server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-gui
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-server
      PMA_PORT: 3306
    depends_on:
      - mysql-server

volumes:
  mysql_data:

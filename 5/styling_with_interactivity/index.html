<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Available Items</h1>

  <div class="carousel">
    <div class="carousel__body">
      <div class="carousel__body__item">
        <div class="carousel__body__item__image-container">
          <img src="./imgs/1.png" alt="first image">
        </div>
        <h2 class="carousel__body__item__title">First Item</h2>
      </div>
      <div class="carousel__body__item">
        <div class="carousel__body__item__image-container">
          <img src="./imgs/2.png" alt="second image">
        </div>
        <h2 class="carousel__body__item__title">Second Item</h2>
      </div>
      <div class="carousel__body__item">
        <div class="carousel__body__item__image-container">
          <img src="./imgs/3.png" alt="third image">
        </div>
        <h2 class="carousel__body__item__title">Third Item</h2>
      </div>
    </div>

    <button class="carousel__controller carousel__controller--back">
      < </button>
        <button class="carousel__controller carousel__controller--next">
          >
        </button>
  </div>

  <script src="script.js"></script>
</body>

</html>

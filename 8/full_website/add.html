<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a book — Shelf</title>
    <meta name="description" content="Add a new title to your Shelf with status, tags, and notes." />
    <meta name="keywords" content="reading tracker, books, bookshelf, reading list, progress, notes, Shelf" />
    <meta name="author" content="Shelf" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a2421" />
    <link rel="canonical" href="./add.html" />
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/favicon/favicon.ico" />

    <meta property="og:site_name" content="Shelf" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Add a book — Shelf" />
    <meta property="og:description" content="Add a new title to your Shelf with status, tags, and notes." />
    <meta property="og:image" content="./assets/imgs/img.webp" />
    <meta property="og:url" content="./add.html" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Add a book — Shelf" />
    <meta name="twitter:description" content="Add a new title to your Shelf with status, tags, and notes." />
    <meta name="twitter:image" content="./assets/imgs/img.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/common/index.css" />
    <link rel="stylesheet" href="./styles/pages/add.css" />
  </head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="./index.html">Shelf</a>
    <nav class="nav" aria-label="Primary">
      <a href="./index.html" class="nav__link">Home</a>
      <a href="./library.html" class="nav__link">Library</a>
      <a href="./add.html" class="nav__link nav__link--active">Add</a>
      <a href="./about.html" class="nav__link">About</a>
    </nav>
  </header>

  <main class="view">
    <section class="page page--add">
      <div class="page__head">
        <div>
          <h1 class="page__title">Add a book</h1>
          <p class="page__lead">Drop a title onto your shelf in a few fields.</p>
        </div>
      </div>

      <form class="form" id="add-form" action="./library.html" method="get" novalidate>
        <div class="field">
          <label class="field__label" for="title">Title</label>
          <input id="title" class="field__control" name="title" type="text" required placeholder="e.g. Atomic Habits"
            autocomplete="off" />
        </div>
        <div class="field">
          <label class="field__label" for="author">Author</label>
          <input id="author" class="field__control" name="author" type="text" required placeholder="e.g. James Clear"
            autocomplete="off" />
        </div>
        <div class="field">
          <label class="field__label" for="status">Starting status</label>
          <select id="status" class="field__control" name="status">
            <option value="want">Want to read</option>
            <option value="reading">Reading</option>
            <option value="finished">Finished</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="tags">
            Tags <span class="field__hint">(comma-separated)</span>
          </label>
          <input id="tags" class="field__control" name="tags" type="text" placeholder="design, career" />
        </div>
        <div class="field">
          <label class="field__label" for="notes">Notes</label>
          <textarea id="notes" class="field__control" name="notes" rows="4"
            placeholder="Why this book? First impressions?"></textarea>
        </div>
        <div class="form__actions">
          <button type="submit" class="btn btn--primary">Add to shelf</button>
          <a class="btn btn--ghost" href="./library.html">Cancel</a>
        </div>
        <p class="form__error" id="form-error" hidden></p>
        <p class="form__notice" id="form-notice">Validated with Zod and saved to session storage.</p>
      </form>
    </section>
  </main>

  <script src="./js/state-management.js"></script>
  <script type="module" src="./js/add.js"></script>
</body>

</html>

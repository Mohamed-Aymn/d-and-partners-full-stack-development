  <style>
    .container {
      display: grid;
      background-color: lightblue;
      height: 100vh;

      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 10px;

    }

    .item {
      background-color: red;
      padding: 20px;
      /* grid-auto-flow: row dense; */
      /* grid-row-start: 7; */
    }

    .item:nth-child(1) {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
    }

    .item:nth-child(2) {
      grid-column: 3 / 7;
      grid-row: 1 / 5;
    }

    .item:nth-child(3) {
      grid-column: 7 / 8;
      grid-row: 1 / 4;
    }

    .item:nth-child(4) {
      grid-column: 1 / 8;
      grid-row: 5 / 7;
    }
  </style>


</head>

<body>


  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    <div class="item">Item 4</div>
  </div>

</body>

</html>

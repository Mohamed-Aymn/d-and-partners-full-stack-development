<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelf — reading tracker</title>
    <meta name="description" content="Track what you are reading, want to read, and have finished. A simple browser reading shelf with progress and notes." />
    <meta name="keywords" content="reading tracker, books, bookshelf, reading list, progress, notes, Shelf" />
    <meta name="author" content="Shelf" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a2421" />
    <link rel="canonical" href="https://example.com/index.html" />
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/favicon/favicon.ico" />

    <meta property="og:site_name" content="Shelf" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shelf — reading tracker" />
    <meta property="og:description" content="Track what you are reading, want to read, and have finished. A simple browser reading shelf with progress and notes." />
    <meta property="og:image" content="./assets/imgs/img.webp" />
    <meta property="og:url" content="https://example.com/index.html" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shelf — reading tracker" />
    <meta name="twitter:description" content="Track what you are reading, want to read, and have finished. A simple browser reading shelf with progress and notes." />
    <meta name="twitter:image" content="./assets/imgs/img.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/common/index.css" />
    <link rel="stylesheet" href="./styles/pages/home.css" />
  </head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="./index.html">Shelf</a>
    <nav class="nav" aria-label="Primary">
      <a href="./index.html" class="nav__link nav__link--active">Home</a>
      <a href="./library.html" class="nav__link">Library</a>
      <a href="./add.html" class="nav__link">Add</a>
      <a href="./about.html" class="nav__link">About</a>
    </nav>
  </header>

  <main class="view">
    <section class="page page--home">
      <div class="hero">
        <video
          class="hero__video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          aria-hidden="true"
        >
          <source src="./assets/videos/video.webm" type="video/webm" />
        </video>
        <div class="hero__overlay"></div>
        <div class="hero__content">
          <p class="hero__eyebrow">Your reading shelf</p>
          <h1 class="hero__title">What are you reading next?</h1>
          <p class="hero__lead">
            Track titles, progress, and notes — all in the browser, no account required.
          </p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="./library.html">Open library</a>
            <a class="btn btn--ghost" href="./add.html">Add a book</a>
          </div>
        </div>
      </div>

      <ul class="stats" id="stats"></ul>

      <section class="section">
        <div class="section__head">
          <h2 class="section__title">Currently reading</h2>
          <a href="./library.html" class="text-link">View all</a>
        </div>
        <ul class="book-list" id="reading-list"></ul>
      </section>
    </section>
  </main>
  <script type="module" src="./ts/home.ts"></script>
</body>

</html>

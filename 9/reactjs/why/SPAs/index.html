<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal SPA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f5f5f5;
      }
      nav {
        display: flex;
        gap: 1rem;
        padding: 1rem 1.5rem;
        background: #fff;
        border-bottom: 1px solid #ddd;
      }
      nav a {
        color: #333;
        text-decoration: none;
      }
      nav a.active {
        font-weight: 700;
        text-decoration: underline;
      }
      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#/" data-link>Home</a>
      <a href="#/about" data-link>About</a>
    </nav>
    <main id="app"></main>
    <script src="app.js"></script>
  </body>
</html>
